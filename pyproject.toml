[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teragucci"
version = "2.0.0"
description = "Open-source remote desktop with Wacom pen pressure, H.264 4:4:4, health monitoring — Teradici/Parsec/RGS replacement"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
server = [
    "websockets>=12.0",
    "mss>=9.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]
client = [
    "websockets>=12.0",
    "PySide6>=6.6",
]

[project.scripts]
teragucci-server = "server.main:main"
teragucci-client = "client.main:main"

[tool.setuptools.packages.find]
include = ["server*", "client*", "common*"]
