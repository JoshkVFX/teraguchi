[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teraguchi"
version = "3.0.0"
description = "Open-source remote desktop for creative professionals — GPU-accelerated H.264/H.265/AV1 with YUV 4:4:4, full Wacom pen pressure, USB passthrough, file transfer, and per-user session isolation. Replaces Teradici PCoIP, HP Anywhere, Parsec, and HP RGS."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
server = [
    "websockets>=12.0",
    "mss>=9.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]
client = [
    "websockets>=12.0",
    "PySide6>=6.6",
]

[project.scripts]
teraguchi-server = "server.main:main"
teraguchi-client = "client.main:main"

[tool.setuptools.packages.find]
include = ["server*", "client*", "common*"]
